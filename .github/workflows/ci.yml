name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck

      # Cluster tests run against a real JetStream-enabled NATS server.
      - name: Start NATS
        run: docker run -d --name nats -p 4222:4222 nats:2.15-alpine -js
      - name: Test
        run: bun test
        env:
          NATS_TEST_URL: nats://127.0.0.1:4222

      - run: bun run build
      - name: Validate docker-compose.yml
        run: DISCORD_TOKEN=ci docker compose config --quiet

      - uses: actions/upload-artifact@v7
        with:
          name: calendarbot-bundle
          path: release/

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/calendarbot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      # Always build the image; only push it for version tags.
      - uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 so the image also runs on Raspberry Pi and Graviton
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/calendarbot:${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "Docker image: \`$image\`"
