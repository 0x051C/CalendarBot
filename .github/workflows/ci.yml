name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck

      # Cluster and auth tests start their own throwaway JetStream servers.
      - name: Install nats-server
        run: |
          V=v2.15.3; A=nats-server-$V-linux-amd64.tar.gz
          curl -fsSLO "https://github.com/nats-io/nats-server/releases/download/$V/$A"
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/$V/SHA256SUMS" | grep " $A\$" | sha256sum -c -
          tar -xzf "$A" && sudo install -m 755 "nats-server-$V-linux-amd64/nats-server" /usr/local/bin/
          nats-server --version
      - name: Test
        run: bun test

      - run: bun run build
      - name: Validate docker-compose.yml
        run: DISCORD_TOKEN=ci docker compose config --quiet

      - uses: actions/upload-artifact@v7
        with:
          name: calendarbot-bundle
          path: release/

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/calendarbot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      # Always build the image; only push it for version tags.
      - uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 so the image also runs on Raspberry Pi and Graviton
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/calendarbot:${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            --notes "Docker image: \`$image\`"
